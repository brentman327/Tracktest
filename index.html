<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Category Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Sales & Category Tracker</h1>
                <p class="text-sm text-slate-500">Log entries and view aggregated totals by person and category.</p>
            </div>
            <!-- Navigation Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button onclick="switchTab('entry')" id="tab-entry" class="px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-600 transition">Entry Form</button>
                <button onclick="switchTab('results')" id="tab-results" class="px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:text-slate-900 transition">Results Page</button>
            </div>
        </header>

        <!-- TAB 1: ENTRY FORM -->
        <div id="view-entry" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-slate-800">New Entry</h2>
                <form id="entryForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    
                    <!-- Name Dropdown -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Name</label>
                        <select id="employeeName" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="" disabled selected>Select name...</option>
                            <option value="Brent">Brent</option>
                            <option value="Joe">Joe</option>
                            <option value="Stephanie">Stephanie</option>
                            <option value="Alex">Alex</option>
                        </select>
                    </div>

                    <!-- Category Dropdown -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category</label>
                        <select id="itemCategory" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="" disabled selected>Select category...</option>
                            <option value="Washer">Washer</option>
                            <option value="Dryer">Dryer</option>
                            <option value="Mattress">Mattress</option>
                            <option value="Sofa">Sofa</option>
                        </select>
                    </div>

                    <!-- Price Input -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Price ($)</label>
                        <input type="number" id="itemPrice" step="0.01" min="0" placeholder="0.00" required 
                            class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition shadow-sm">
                            Add Entry
                        </button>
                    </div>
                </form>
            </div>

            <!-- Recent Log Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800">Recent Entries</h2>
                    <button onclick="clearData()" class="text-xs text-red-500 hover:underline">Clear All Data</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                            <tr>
                                <th class="p-3">Name</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Price</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="entriesTableBody" class="divide-y divide-slate-100">
                            <!-- Populated via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 2: RESULTS PAGE -->
        <div id="view-results" class="hidden space-y-6">
            
            <!-- Summary Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Breakdown by Category -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 text-slate-800 border-b pb-2">Totals by Category</h2>
                    <div id="categorySummary" class="space-y-3">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Breakdown by Person -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 text-slate-800 border-b pb-2">Totals by Name</h2>
                    <div id="personSummary" class="space-y-3">
                        <!-- Populated via JS -->
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Load existing entries from localStorage or initialize empty array
        let entries = JSON.parse(localStorage.getItem('tracker_entries')) || [];

        function switchTab(tab) {
            const entryView = document.getElementById('view-entry');
            const resultsView = document.getElementById('view-results');
            const tabEntry = document.getElementById('tab-entry');
            const tabResults = document.getElementById('tab-results');

            if (tab === 'entry') {
                entryView.classList.remove('hidden');
                resultsView.classList.add('hidden');
                tabEntry.className = "px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-600 transition";
                tabResults.className = "px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:text-slate-900 transition";
            } else {
                entryView.classList.add('hidden');
                resultsView.classList.remove('hidden');
                tabResults.className = "px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-600 transition";
                tabEntry.className = "px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:text-slate-900 transition";
                renderResults();
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('employeeName').value;
            const category = document.getElementById('itemCategory').value;
            const price = parseFloat(document.getElementById('itemPrice').value);

            const newEntry = {
                id: Date.now(),
                name,
                category,
                price
            };

            entries.push(newEntry);
            saveAndRefresh();

            // Reset form inputs
            document.getElementById('itemPrice').value = '';
            document.getElementById('employeeName').selectedIndex = 0;
            document.getElementById('itemCategory').selectedIndex = 0;
        }

        function deleteEntry(id) {
            entries = entries.filter(entry => entry.id !== id);
            saveAndRefresh();
        }

        function clearData() {
            if (confirm("Are you sure you want to clear all logged entries?")) {
                entries = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('tracker_entries', JSON.stringify(entries));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('entriesTableBody');
            tbody.innerHTML = '';

            if (entries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No entries logged yet.</td></tr>`;
                return;
            }

            // Show newest first
            [...entries].reverse().forEach(entry => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-700">${entry.name}</td>
                    <td class="p-3"><span class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-semibold">${entry.category}</span></td>
                    <td class="p-3 font-semibold text-slate-900">$${entry.price.toFixed(2)}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteEntry(${entry.id})" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderResults() {
            const catSummaryContainer = document.getElementById('categorySummary');
            const personSummaryContainer = document.getElementById('personSummary');

            // Aggregate by Category
            const catTotals = { Washer: 0, Dryer: 0, Mattress: 0, Sofa: 0 };
            const catCounts = { Washer: 0, Dryer: 0, Mattress: 0, Sofa: 0 };

            // Aggregate by Person
            const personTotals = {};
            const personCounts = {};

            entries.forEach(entry => {
                // Categories
                if (catTotals[entry.category] !== undefined) {
                    catTotals[entry.category] += entry.price;
                    catCounts[entry.category] += 1;
                }

                // Persons
                if (!personTotals[entry.name]) {
                    personTotals[entry.name] = 0;
                    personCounts[entry.name] = 0;
                }
                personTotals[entry.name] += entry.price;
                personCounts[entry.name] += 1;
            });

            // Render Category Summary
            catSummaryContainer.innerHTML = '';
            for (const [cat, total] of Object.entries(catTotals)) {
                catSummaryContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg">
                        <div>
                            <span class="font-medium text-slate-800">${cat}</span>
                            <span class="text-xs text-slate-500 block">${catCounts[cat]} items sold</span>
                        </div>
                        <span class="font-bold text-slate-900">$${total.toFixed(2)}</span>
                    </div>
                `;
            }

            // Render Person Summary
            personSummaryContainer.innerHTML = '';
            if (Object.keys(personTotals).length === 0) {
                personSummaryContainer.innerHTML = `<p class="text-slate-400 text-sm">No data available.</p>`;
            } else {
                for (const [person, total] of Object.entries(personTotals)) {
                    personSummaryContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg">
                            <div>
                                <span class="font-medium text-slate-800">${person}</span>
                                <span class="text-xs text-slate-500 block">${personCounts[person]} total logs</span>
                            </div>
                            <span class="font-bold text-slate-900">$${total.toFixed(2)}</span>
                        </div>
                    `;
                }
            }
        }

        // Initialize table on load
        renderTable();
    </script>
</body>
          </html>
