<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Sales Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #17212b;
      background: #f5f7fa;
      --border: #d7dce2;
      --muted: #59636e;
      --primary: #1769aa;
    }

    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 { margin-bottom: 6px; }
    h2 { margin-top: 0; }
    .hint { color: var(--muted); margin-top: 0; }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin: 18px 0;
      box-shadow: 0 2px 6px #17212b0a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    button {
      border: 0;
      color: white;
      background: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(.92); }

    .secondary {
      width: auto;
      background: #59636e;
    }

    .danger {
      width: auto;
      padding: 6px 10px;
      background: #a52a2a;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 14px;
    }

    .toolbar > div { min-width: 180px; }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th button {
      width: auto;
      padding: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .empty { color: var(--muted); padding: 18px 0; }
    #salesChart { max-height: 390px; }

    @media (max-width: 550px) {
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <h1>Employee Sales Tracker</h1>
  <p class="hint">Record item sales and review employee activity over time.</p>

  <section class="panel">
    <h2>Record a sale</h2>
    <form id="saleForm" class="form-grid">
      <div>
        <label for="employee">Employee number</label>
        <select id="employee" required>
          <option value="">Select employee</option>
          <option value="8695">8695</option>
          <option value="12976">12976</option>
          <option value="15288">15288</option>
          <option value="17469">17469</option>
          <option value="18932">18932</option>
          <option value="18015">18015</option>
          <option value="20788">20788</option>
        </select>
      </div>

      <div>
        <label for="item">Item number</label>
        <input id="item" type="text" maxlength="80"
               placeholder="Enter item number" required>
      </div>

      <div>
        <label for="quantity">Quantity sold</label>
        <input id="quantity" type="number" min="1" step="1"
               value="1" required>
      </div>

      <div>
        <label for="saleDate">Date sold</label>
        <input id="saleDate" type="date" required>
      </div>

      <button type="submit">Add sale</button>
    </form>
  </section>

  <section class="panel">
    <h2>Sales over time</h2>
    <div class="toolbar">
      <div>
        <label for="chartFrom">From</label>
        <input id="chartFrom" type="date">
      </div>
      <div>
        <label for="chartTo">To</label>
        <input id="chartTo" type="date">
      </div>
      <div>
        <label for="chartMetric">Graph</label>
        <select id="chartMetric">
          <option value="quantity">Quantity sold</option>
          <option value="records">Number of sales records</option>
        </select>
      </div>
    </div>

    <canvas id="salesChart" aria-label="Sales over time by employee"></canvas>
    <p id="chartEmpty" class="empty" hidden>
      No sales match the selected date range.
    </p>
  </section>

  <section class="panel">
    <h2>Sales records</h2>
    <div class="toolbar">
      <div>
        <label for="search">Search item or employee</label>
        <input id="search" type="search" placeholder="Type to filter records">
      </div>
      <button id="exportCsv" class="secondary" type="button">Export CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" data-sort="date">Date ↕</button></th>
            <th><button type="button" data-sort="employee">Employee ↕</button></th>
            <th><button type="button" data-sort="item">Item number ↕</button></th>
            <th><button type="button" data-sort="quantity">Quantity ↕</button></th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="salesBody"></tbody>
      </table>
    </div>

    <p id="tableEmpty" class="empty" hidden>No sales recorded yet.</p>
  </section>

  <script>
    const EMPLOYEES = [
      "8695", "12976", "15288", "17469", "18932", "18015", "20788"
    ];
    const STORAGE_KEY = "employeeSalesTrackerRecords";

    let sales = loadSales();
    let sortKey = "date";
    let sortDirection = "desc";
    let chart = null;

    const $ = (id) => document.getElementById(id);

    function loadSales() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveSales() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sales));
    }

    function filteredSales() {
      const term = $("search").value.trim().toLowerCase();

      return sales
        .filter((sale) =>
          !term ||
          sale.employee.toLowerCase().includes(term) ||
          sale.item.toLowerCase().includes(term)
        )
        .sort((a, b) => {
          const left = a[sortKey];
          const right = b[sortKey];
          const comparison = sortKey === "quantity"
            ? Number(left) - Number(right)
            : String(left).localeCompare(
                String(right), undefined, { numeric: true }
              );

          return comparison * (sortDirection === "asc" ? 1 : -1);
        });
    }

    function renderTable() {
      const body = $("salesBody");
      body.replaceChildren();

      const records = filteredSales();
      $("tableEmpty").hidden = records.length > 0;

      records.forEach((sale) => {
        const row = document.createElement("tr");

        [sale.date, sale.employee, sale.item, sale.quantity].forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", `Delete item ${sale.item}`);

        deleteButton.addEventListener("click", () => {
          sales = sales.filter((record) => record.id !== sale.id);
          saveSales();
          renderAll();
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);
        body.appendChild(row);
      });
    }

    function renderChart() {
      const from = $("chartFrom").value;
      const to = $("chartTo").value;
      const records = sales.filter((sale) =>
        (!from || sale.date >= from) && (!to || sale.date <= to)
      );

      const isEmpty = records.length === 0;
      $("chartEmpty").hidden = !isEmpty;
      $("salesChart").hidden = isEmpty;

      if (chart) {
        chart.destroy();
        chart = null;
      }
      if (isEmpty) return;

      const dates = [...new Set(records.map((sale) => sale.date))].sort();
      const metric = $("chartMetric").value;

      const datasets = EMPLOYEES.map((employee, index) => {
        const totalsByDate = Object.fromEntries(
          dates.map((date) => [date, 0])
        );

        records
          .filter((sale) => sale.employee === employee)
          .forEach((sale) => {
            totalsByDate[sale.date] +=
              metric === "quantity" ? Number(sale.quantity) : 1;
          });

        const hue = (index * 67 + 205) % 360;

        return {
          label: `Employee ${employee}`,
          data: dates.map((date) => totalsByDate[date]),
          borderColor: `hsl(${hue} 65% 42%)`,
          backgroundColor: `hsl(${hue} 65% 42% / 15%)`,
          tension: 0.25
        };
      });

      chart = new Chart($("salesChart"), {
        type: "line",
        data: { labels: dates, datasets },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: metric === "quantity"
                  ? "Quantity sold"
                  : "Sales records"
              }
            },
            x: {
              title: { display: true, text: "Date" }
            }
          }
        }
      });
    }

    function renderAll() {
      renderTable();
      renderChart();
    }

    $("saleDate").value = new Date().toISOString().slice(0, 10);

    $("saleForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const employee = $("employee").value;
      const item = $("item").value.trim();
      const quantity = Number($("quantity").value);
      const date = $("saleDate").value;

      if (
        !employee ||
        !EMPLOYEES.includes(employee) ||
        !item ||
        !date ||
        !Number.isInteger(quantity) ||
        quantity < 1
      ) {
        alert("Enter a valid employee number, item number, quantity, and date.");
        return;
      }

      sales.push({
        id: crypto.randomUUID
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random()}`,
        employee,
        item,
        quantity,
        date
      });

      saveSales();
      $("item").value = "";
      $("quantity").value = "1";
      renderAll();
    });

    document.querySelectorAll("[data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.sort;

        if (sortKey === key) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDirection = key === "date" ? "desc" : "asc";
        }

        renderTable();
      });
    });

    $("search").addEventListener("input", renderTable);
    $("chartFrom").addEventListener("change", renderChart);
    $("chartTo").addEventListener("change", renderChart);
    $("chartMetric").addEventListener("change", renderChart);

    $("exportCsv").addEventListener("click", () => {
      const rows = [["Date", "Employee number", "Item number", "Quantity"]];

      filteredSales().forEach((sale) => {
        rows.push([sale.date, sale.employee, sale.item, sale.quantity]);
      });

      const csv = rows.map((row) =>
        row.map((value) =>
          `"${String(value).replaceAll('"', '""')}"`
        ).join(",")
      ).join("\n");

      const link = document.createElement("a");
      link.href = URL.createObjectURL(
        new Blob([csv], { type: "text/csv" })
      );
      link.download = "sales-records.csv";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    renderAll();
  </script>
</body>
</html>
